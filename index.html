<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Website</title>
    <style>
      :root {
        color-scheme: light;
        --text: #1f2933;
        --muted: #52616b;
        --line: #d9e2ec;
        --accent: #0f766e;
        --bg: #f7f9fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
      }

      main {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 96px 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.125rem;
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }

      footer {
        margin-top: 64px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>こんにちは</h1>
      <p>
        GitHub Pagesで公開するシンプルなWebサイトです。
        ここに自己紹介やプロジェクトへのリンクを追加できます。
      </p>
      <p>
        <a href="https://github.com/">GitHubを見る</a>
      </p>
      <footer>
        &copy; 2026 My Website
      </footer>
    </main>
  </body>
</html>
